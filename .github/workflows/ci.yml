name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - name: requirements.txt matches uv.lock
        if: runner.os == 'Linux'
        run: |
          uv export --no-dev --no-hashes --no-editable --no-header --format requirements-txt --frozen --quiet -o /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt
      - run: uv build
