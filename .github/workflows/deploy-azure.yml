# Deploys the app code to Azure App Service. Never runs automatically:
# someone on the approved list must start it from the Actions tab and type "deploy".
# Data (PDFs, figures, index) lives on the server and is not deployed from Git.
# Setup: docs/deploy_azure.md
name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to deploy the latest main commit to Azure'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Check approver, branch and confirmation
        env:
          APPROVERS: ${{ vars.AZURE_DEPLOY_APPROVERS }}
          ACTOR: ${{ github.actor }}
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          approvers="$(echo "${APPROVERS:-sophie-lara}" | tr -d ' ')"
          if [ "$CONFIRM" != "deploy" ]; then echo "::error::Type deploy to confirm."; exit 1; fi
          if [ "$REF" != "refs/heads/main" ]; then echo "::error::Deploy only from main."; exit 1; fi
          if ! echo ",$approvers," | grep -q ",$ACTOR,"; then
            echo "::error::$ACTOR is not in AZURE_DEPLOY_APPROVERS."; exit 1
          fi
          echo "Approved by $ACTOR"

  verify:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - name: requirements.txt matches uv.lock
        run: |
          uv export --no-dev --no-hashes --no-editable --no-header --format requirements-txt --frozen --quiet -o /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Front end checks
        working-directory: frontend
        run: npm ci && npm run typecheck && npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # With GitHub Enterprise or a public repo, add `environment: production` here and
    # set required reviewers on it for an approval button (update the Azure federated
    # credential subject to repo:<owner>/<repo>:environment:production).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the React front end into src/combustion_atlas/app/web
        working-directory: frontend
        run: npm ci && npm run build
      - name: Check the build exists
        run: test -f src/combustion_atlas/app/web/index.html
      - name: Package code and built front end
        run: zip -r app.zip src pyproject.toml requirements.txt README.md -x '*__pycache__*'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app.zip
